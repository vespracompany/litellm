timeout: 3600s

substitutions:
  _IMAGE_TAG: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - docker/Dockerfile.database
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/litellm-custom/litellm:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/litellm-custom/litellm:${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - litellm
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/litellm-custom/litellm:${_IMAGE_TAG}
      - --region=us-central1
      - --platform=managed
      - --quiet

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/litellm-custom/litellm:${_IMAGE_TAG}
