timeout: 3600s

substitutions:
  _IMAGE_TAG: manual
  _GIT_SHA: main

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ceu
      - |
        git clone --filter=blob:none --no-checkout https://github.com/vespracompany/litellm.git /workspace/source
        git -C /workspace/source fetch --depth=1 origin "${_GIT_SHA}"
        git -C /workspace/source checkout --detach "${_GIT_SHA}"

  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file
      - /workspace/source/docker/Dockerfile.database
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/litellm-custom/litellm:${_IMAGE_TAG}
      - /workspace/source

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/litellm-custom/litellm:${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - litellm
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/litellm-custom/litellm:${_IMAGE_TAG}
      - --region=us-central1
      - --platform=managed
      - --quiet

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/litellm-custom/litellm:${_IMAGE_TAG}
